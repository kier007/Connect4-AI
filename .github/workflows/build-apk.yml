name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install React dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Prepare offline React assets
        working-directory: web
        run: npm run prepare:android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare APK and checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Connect4-AI.apk
          sha256sum Connect4-AI.apk > Connect4-AI.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Connect4-AI-APK
          path: |
            Connect4-AI.apk
            Connect4-AI.apk.sha256
          if-no-files-found: error
          retention-days: 30
